<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Birthday | Jakree Pitpeng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --bg-card: #121826;
      --text: #e8edf5;
      --text-muted: #94a3b8;
      --accent: #22d3ee;
      --accent-soft: rgba(34, 211, 238, 0.15);
      --border: rgba(148, 163, 184, 0.12);
      --gradient: linear-gradient(135deg, #22d3ee 0%, #818cf8 100%);
      --pink: #f472b6;
      --pink-soft: rgba(244, 114, 182, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: -15%;
      right: -10%;
      width: 45%;
      height: 45%;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    a { color: inherit; text-decoration: none; }

    .navbar {
      padding: 1rem 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .logo span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-link {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent); }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
      position: relative;
      z-index: 1;
    }

    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 2rem;
      text-align: center;
    }

    .hero-image {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      display: block;
    }

    .hero-content {
      padding: 2rem 1.5rem;
    }

    .hero-content .emoji {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }

    .hero-content h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .hero-content .date {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--pink-soft);
      color: var(--pink);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      margin-top: 0.75rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 560px) {
      .info-grid { grid-template-columns: 1fr; }
    }

    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .info-card h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .info-card ul {
      list-style: none;
    }

    .info-card li {
      padding: 0.5rem 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.95rem;
    }

    .info-card li::before {
      content: '✓';
      color: var(--accent);
      font-weight: 700;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    .map-link:hover {
      background: rgba(34, 211, 238, 0.25);
      transform: translateY(-1px);
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo">Jakree<span>.</span></a>
      <a href="../index.html" class="back-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Portfolio
      </a>
    </div>
  </nav>

  <main>
    <div class="hero-card">
      <img 
        class="hero-image" 
        src="https://raw.githubusercontent.com/appbrewery/webdev/main/birthday-cake3.4.jpeg" 
        alt="Birthday Cake"
        onerror="this.style.display='none'"
      >
      <div class="hero-content">
        <div class="emoji">🎂</div>
        <h1>It's my birthday!</h1>
        <div class="date">📅 6th of April</div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <h2>🎁 What to bring?</h2>
        <ul>
          <li>A gift</li>
          <li>Your presence</li>
          <li>Some snacks</li>
        </ul>
      </div>

      <div class="info-card">
        <h2>📍 Where to find me?</h2>
        <a 
          href="https://www.google.com/maps/@14.0925019,100.6064627,16z?entry=ttu" 
          target="_blank" 
          rel="noopener"
          class="map-link"
        >
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          Open Google Maps
        </a>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Jakree Pitpeng</p>
  </footer>
</body>
</html>
