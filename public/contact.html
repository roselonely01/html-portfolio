<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Me | Jakree Pitpeng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --bg-card: #121826;
      --text: #e8edf5;
      --text-muted: #94a3b8;
      --accent: #22d3ee;
      --accent-soft: rgba(34, 211, 238, 0.15);
      --border: rgba(148, 163, 184, 0.12);
      --gradient: linear-gradient(135deg, #22d3ee 0%, #818cf8 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 45%;
      height: 45%;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    a { color: inherit; text-decoration: none; }

    .navbar {
      padding: 1rem 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .logo span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-link {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent); }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
      position: relative;
      z-index: 1;
    }

    .page-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .page-header .label {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .page-header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .page-header p {
      color: var(--text-muted);
    }

    .contact-cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .contact-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.35rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.15rem;
      transition: all 0.25s;
    }

    .contact-card:hover {
      border-color: rgba(34, 211, 238, 0.3);
      transform: translateX(4px);
    }

    .contact-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-content .label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }

    .contact-content .value {
      font-weight: 500;
      font-size: 1rem;
      word-break: break-all;
    }

    .contact-content a.value {
      color: var(--accent);
      transition: opacity 0.2s;
    }

    .contact-content a.value:hover {
      opacity: 0.8;
    }

    .address-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
    }

    .address-card h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .address-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .btn-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 2rem;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.4rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.25s;
    }

    .btn-primary {
      background: var(--gradient);
      color: #0b0f19;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -6px rgba(34, 211, 238, 0.4);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: var(--bg-card);
      border-color: var(--text-muted);
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo">Jakree<span>.</span></a>
      <a href="../index.html" class="back-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Portfolio
      </a>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <span class="label">Get in Touch</span>
      <h1>Contact Me</h1>

    </div>

          </svg>
        </div>
        <div class="contact-content">
          <div class="label">Phone</div>
          <a href="tel:+66808035267" class="value">+66 80 803 5267</a>

      <!-- Email -->
      <div class="contact-card">

          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <div class="contact-content">
          <div class="label">Email</div>
          <a href="mailto:jk.pitpeng@gmail.com" class="value">jk.pitpeng@gmail.com</a>
        </div>
      </div>
    </div>

    <!-- Address -->
    <div class="address-card">
      <h2>
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>

        </svg>
        Address
      </h2>
      <p>
        16/13843 Phahonyothin Street<br>
        Khlong Nueng, Khlong Luang<br>
        Pathum Thani
      </p>
    </div>

    <div class="btn-row">
      <a href="mailto:jk.pitpeng@gmail.com" class="btn btn-primary">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Send Email
      </a>
      <a href="ProjectWebpages.html" class="btn btn-outline">About Me</a>
    </div>
  </main>

  <footer>
    <p>© 2026 Jakree Pitpeng</p>
  </footer>
</body>
</html>
